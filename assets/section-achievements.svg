<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 72" width="900" height="72" role="img" aria-label="ACHIEVEMENTS">
<title>ACHIEVEMENTS</title>
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0b0e1a"/><stop offset="1" stop-color="#1c1038"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc83d"/><stop offset="1" stop-color="#ff2e88"/></linearGradient>
<linearGradient id="swp" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<clipPath id="cp"><rect width="900" height="72" rx="11"/></clipPath>
</defs>
<style>
.t{font-family:Impact,'Arial Black','Haettenschweiler','Arial Narrow Bold',sans-serif;font-size:27px;letter-spacing:3px;fill:#fff}
.g{font-family:'Courier New',ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700;font-size:11px;letter-spacing:3px;fill:#ffc83d}
.n{font-family:'Courier New',ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;letter-spacing:2px;fill:#5b6498}
.bar{animation:br 2.4s ease-in-out infinite}@keyframes br{0%,100%{opacity:1}50%{opacity:.55}}
.sw{animation:sw 4.5s linear infinite}@keyframes sw{from{transform:translateX(-220px)}to{transform:translateX(1120px)}}
.dot{animation:dd 1.4s steps(1) infinite}@keyframes dd{0%{opacity:1}50%{opacity:.15}}
.i-shine{animation:sh 2.8s ease-in-out infinite}@keyframes sh{0%{transform:translateX(0) skewX(-20deg)}60%,100%{transform:translateX(60px) skewX(-20deg)}}.i-sp{transform-box:fill-box;transform-origin:center;animation:spk 1.8s ease-in-out infinite}@keyframes spk{0%,100%{transform:scale(.3);opacity:.3}50%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#cp)">
<rect width="900" height="72" fill="url(#bg)"/>
<rect class="bar" width="7" height="72" fill="url(#ac)"/>
<rect x="22" y="10" width="52" height="52" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#2f3566"/>
<g transform="translate(24,12)"><clipPath id="tc"><path d="M14 6h20v14c0 7-4.500 12-10 12s-10-5-10-12z"/></clipPath>
<path d="M14 6h20v14c0 7-4.500 12-10 12s-10-5-10-12z" fill="rgba(255,200,61,.25)" stroke="#ffc83d" stroke-width="2.4" stroke-linejoin="round"/>
<path d="M14 10H7v4c0 4 3 7 7 7M34 10h7v4c0 4-3 7-7 7" fill="none" stroke="#ffc83d" stroke-width="2.4" stroke-linecap="round"/>
<path d="M24 32v6" stroke="#ffc83d" stroke-width="3"/><rect x="15" y="38" width="18" height="5" rx="2" fill="#ffc83d"/>
<g clip-path="url(#tc)"><rect class="i-shine" x="-10" y="0" width="7" height="44" fill="#fff" opacity=".75" transform="skewX(-20)"/></g>
<path class="i-sp" d="M41 3l1.4 3.600L46 8l-3.600 1.400L41 13l-1.400-3.600L36 8l3.600-1.400z" fill="#fff"/><path class="i-sp" style="animation-delay:-.9s" d="M6 33l1 2.600L9.600 37 7 38l-1 2.600L5 38l-2.600-1L5 35.600z" fill="#22d3ee"/></g>
<text class="t" x="94" y="38">ACHIEVEMENTS</text>
<text class="g" x="95" y="58">// UNLOCKED</text>
<text class="n" x="872" y="30" text-anchor="end">SEC 07</text>
<g fill="#ffc83d"><rect class="dot" x="832" y="40" width="10" height="4" rx="1"/><rect class="dot" style="animation-delay:-.45s" x="846" y="40" width="10" height="4" rx="1"/><rect class="dot" style="animation-delay:-.9s" x="860" y="40" width="10" height="4" rx="1"/></g>
<rect x="0" y="70" width="900" height="2" fill="#2a2f55"/>
<rect class="sw" x="0" y="69" width="220" height="3" fill="url(#swp)"/>
</g>
<rect x=".5" y=".5" width="899" height="71" rx="11" fill="none" stroke="#2a2f55"/>
</svg>