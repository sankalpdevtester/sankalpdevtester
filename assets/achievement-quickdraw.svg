<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 104" width="440" height="104" role="img" aria-label="GitHub achievement unlocked: QUICKDRAW. Closed an issue or PR within 5 minutes of opening">
<title>Achievement unlocked: QUICKDRAW</title>
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0b0e1a"/><stop offset="1" stop-color="#1c1038"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#22d3ee" stop-opacity=".9"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<clipPath id="cp"><rect width="440" height="104" rx="14"/></clipPath>
</defs>
<style>
.k{font-family:'Courier New',ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700;font-size:11px;letter-spacing:3px;fill:#22d3ee}
.h{font-family:Impact,'Arial Black','Haettenschweiler','Arial Narrow Bold',sans-serif;font-size:30px;letter-spacing:3px;fill:#fff}
.d{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:13px;fill:#aab3e6}
