<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 72" width="900" height="72" role="img" aria-label="ABOUT ME">
<title>ABOUT ME</title>
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0b0e1a"/><stop offset="1" stop-color="#1c1038"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff2e88"/></linearGradient>
<linearGradient id="swp" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<clipPath id="cp"><rect width="900" height="72" rx="11"/></clipPath>
</defs>
<style>
.t{font-family:Impact,'Arial Black','Haettenschweiler','Arial Narrow Bold',sans-serif;font-size:27px;letter-spacing:3px;fill:#fff}
.g{font-family:'Courier New',ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700;font-size:11px;letter-spacing:3px;fill:#ff7a1a}
.n{font-family:'Courier New',ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;letter-spacing:2px;fill:#5b6498}
.bar{animation:br 2.4s ease-in-out infinite}@keyframes br{0%,100%{opacity:1}50%{opacity:.55}}
.sw{animation:sw 4.5s linear infinite}@keyframes sw{from{transform:translateX(-220px)}to{transform:translateX(1120px)}}
.dot{animation:dd 1.4s steps(1) infinite}@keyframes dd{0%{opacity:1}50%{opacity:.15}}
.i-float{animation:fl 3s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(1.5px)}50%{transform:translateY(-2px)}}.i-b1{animation:bb 1.2s steps(1) infinite}.i-b2{animation:bb 1.2s steps(1) infinite -.6s}@keyframes bb{0%{opacity:1}50%{opacity:.2}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#cp)">
<rect width="900" height="72" fill="url(#bg)"/>
<rect class="bar" width="7" height="72" fill="url(#ac)"/>
<rect x="22" y="10" width="52" height="52" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#2f3566"/>
<g transform="translate(24,12)"><g class="i-float"><path d="M13 15h22c5 0 8 3 9 8l2 11c.6 3.5-2 6-5 6-2 0-3.5-1-4.5-2.8L35 33H13l-2.5 4.2C9.5 39 8 40 6 40c-3 0-5.6-2.5-5-6l2-11c1-5 4-8 10-8z" fill="rgba(255,200,61,.14)" stroke="#ffc83d" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M12 24h9M16.5 19.5v9" stroke="#22d3ee" stroke-width="2.6" stroke-linecap="round"/>
<circle class="i-b1" cx="31" cy="22" r="2.7" fill="#ff2e88"/><circle class="i-b2" cx="37" cy="27" r="2.7" fill="#ff7a1a"/></g></g>
<text class="t" x="94" y="38">ABOUT ME</text>
<text class="g" x="95" y="58">// PLAYER PROFILE</text>
<text class="n" x="872" y="30" text-anchor="end">SEC 01</text>
<g fill="#ff7a1a"><rect class="dot" x="832" y="40" width="10" height="4" rx="1"/><rect class="dot" style="animation-delay:-.45s" x="846" y="40" width="10" height="4" rx="1"/><rect class="dot" style="animation-delay:-.9s" x="860" y="40" width="10" height="4" rx="1"/></g>
<rect x="0" y="70" width="900" height="2" fill="#2a2f55"/>
<rect class="sw" x="0" y="69" width="220" height="3" fill="url(#swp)"/>
</g>
<rect x=".5" y=".5" width="899" height="71" rx="11" fill="none" stroke="#2a2f55"/>
</svg>