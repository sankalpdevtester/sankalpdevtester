<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 72" width="900" height="72" role="img" aria-label="TECH STACK">
<title>TECH STACK</title>
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0b0e1a"/><stop offset="1" stop-color="#1c1038"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="swp" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<clipPath id="cp"><rect width="900" height="72" rx="11"/></clipPath>
</defs>
<style>
.t{font-family:Impact,'Arial Black','Haettenschweiler','Arial Narrow Bold',sans-serif;font-size:27px;letter-spacing:3px;fill:#fff}
.g{font-family:'Courier New',ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:700;font-size:11px;letter-spacing:3px;fill:#22d3ee}
.n{font-family:'Courier New',ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;letter-spacing:2px;fill:#5b6498}
.bar{animation:br 2.4s ease-in-out infinite}@keyframes br{0%,100%{opacity:1}50%{opacity:.55}}
.sw{animation:sw 4.5s linear infinite}@keyframes sw{from{transform:translateX(-220px)}to{transform:translateX(1120px)}}
.dot{animation:dd 1.4s steps(1) infinite}@keyframes dd{0%{opacity:1}50%{opacity:.15}}
.i-spin{transform-box:fill-box;transform-origin:center;animation:sp 9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.i-core{animation:co 1.6s ease-in-out infinite}@keyframes co{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#cp)">
<rect width="900" height="72" fill="url(#bg)"/>
<rect class="bar" width="7" height="72" fill="url(#ac)"/>
<rect x="22" y="10" width="52" height="52" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#2f3566"/>
<g transform="translate(24,12)"><g class="i-spin"><path d="M38.3 18.0 L43.5 19.6 L43.5 28.4 L38.3 30.0 L38.4 29.8 L40.9 34.7 L34.7 40.9 L29.8 38.4 L30.0 38.3 L28.4 43.5 L19.6 43.5 L18.0 38.3 L18.2 38.4 L13.3 40.9 L7.1 34.7 L9.6 29.8 L9.7 30.0 L4.5 28.4 L4.5 19.6 L9.7 18.0 L9.6 18.2 L7.1 13.3 L13.3 7.1 L18.2 9.6 L18.0 9.7 L19.6 4.5 L28.4 4.5 L30.0 9.7 L29.8 9.6 L34.7 7.1 L40.9 13.3 L38.4 18.2Z" fill="rgba(34,211,238,.12)" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="24" cy="24" r="6.5" fill="none" stroke="#ffc83d" stroke-width="2.4"/></g><circle class="i-core" cx="24" cy="24" r="2.2" fill="#ff2e88"/></g>
<text class="t" x="94" y="38">TECH STACK</text>
<text class="g" x="95" y="58">// LOADOUT</text>
<text class="n" x="872" y="30" text-anchor="end">SEC 03</text>
<g fill="#22d3ee"><rect class="dot" x="832" y="40" width="10" height="4" rx="1"/><rect class="dot" style="animation-delay:-.45s" x="846" y="40" width="10" height="4" rx="1"/><rect class="dot" style="animation-delay:-.9s" x="860" y="40" width="10" height="4" rx="1"/></g>
<rect x="0" y="70" width="900" height="2" fill="#2a2f55"/>
<rect class="sw" x="0" y="69" width="220" height="3" fill="url(#swp)"/>
</g>
<rect x=".5" y=".5" width="899" height="71" rx="11" fill="none" stroke="#2a2f55"/>
</svg>